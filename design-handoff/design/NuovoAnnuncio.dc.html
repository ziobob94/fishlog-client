<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>FishLog Nuovo annuncio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#111c2c;color:#f1f5f9}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.lab{display:block;margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9db0c8}
.in{width:100%;box-sizing:border-box;height:52px;border-radius:14px;border:1px solid #33486a;background:#1a293d;color:#f1f5f9;font-size:16px;padding:0 16px;outline:none}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #33486a;background:#1a293d;color:#cbd5e1;font-weight:600;font-size:14px}
.chip.on{border-color:#0ea5e9;background:#0ea5e9;color:#0b1623;font-weight:700}
h1,.disp{font-family:'Fraunces',Georgia,serif;font-optical-sizing:auto}
</style>
</helmet>
<div style="width:390px;height:1220px;box-sizing:border-box;background:#111c2c;display:flex;flex-direction:column;overflow:hidden">
  <header style="display:flex;align-items:center;gap:8px;padding:8px 16px 8px 8px;min-height:64px;box-sizing:border-box;border-bottom:1px solid #33486a">
    <a href="MarketLista.dc.html" aria-label="Chiudi" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    <h1 style="margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em">Nuovo annuncio</h1>
  </header>
  <main style="flex:1;overflow:hidden;padding:20px 16px;display:flex;flex-direction:column;gap:20px">
    <section><span class="lab">Foto</span>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
        <div style="position:relative;aspect-ratio:1/1;border-radius:16px;background:#1f3a56;border:2px solid #0ea5e9;display:flex;align-items:center;justify-content:center;color:#6f89a8"><svg class="i" viewBox="0 0 24 24" style="width:28px;height:28px" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="4"/><circle cx="9" cy="10.5" r="1.8"/><path d="m21 15-3.8-3.8a1.5 1.5 0 0 0-2.1 0L7 19.5"/></svg><span style="position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:800;color:#1a1204;background:#f59e0b;border-radius:999px;padding:2px 8px">Copertina</span></div>
        <button aria-label="Aggiungi foto" style="aspect-ratio:1/1;border-radius:16px;border:2px dashed #46617f;background:transparent;color:#7dd3fc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700"><svg class="i" viewBox="0 0 24 24" style="stroke-width:2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Aggiungi</button>
      </div></section>
    <section><label class="lab" for="t">Titolo</label><input id="t" class="in" placeholder="es. Canna spinning 2,70 m"></section>
    <section><span class="lab">Categoria</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip on">Canne</button><button class="chip">Mulinelli</button><button class="chip">Esche</button><button class="chip">Ami e terminali</button><button class="chip">Abbigliamento</button><button class="chip">Accessori</button><button class="chip">Imbarcazioni</button><button class="chip">Altro</button></div></section>
    <section><span class="lab">Condizione</span>
      <div role="group" aria-label="Condizione" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:#1a293d;border:1px solid #33486a;border-radius:16px;padding:4px;gap:4px"><button style="min-height:44px;border-radius:12px;border:0;background:transparent;color:#cbd5e1;font-weight:600;font-size:14px">Nuovo</button><button style="min-height:44px;border-radius:12px;border:0;background:#0ea5e9;color:#0b1623;font-weight:800;font-size:14px">Usato</button></div></section>
    <section style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <div><label class="lab" for="p">Prezzo (€)</label><input id="p" class="in" placeholder="0" inputmode="decimal" style="font-family:'JetBrains Mono',monospace"></div>
      <div><label class="lab" for="z">Zona</label><input id="z" class="in" placeholder="es. Ravenna"></div>
    </section>
    <section><label class="lab" for="d">Descrizione</label><textarea id="d" rows="4" placeholder="Stato, accessori inclusi, modalità di ritiro" style="width:100%;box-sizing:border-box;border-radius:14px;border:1px solid #33486a;background:#1a293d;color:#f1f5f9;font-size:16px;line-height:1.5;padding:14px 16px;resize:none;outline:none"></textarea></section>
  </main>
  <div style="padding:12px 16px 20px;background:#1a293d;border-top:1px solid #33486a"><button style="width:100%;min-height:54px;border-radius:16px;border:0;background:#0ea5e9;color:#0b1623;font-weight:800;font-size:16px">Pubblica annuncio</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1220}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
