<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>FishLog Market lista</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#111c2c;color:#f1f5f9}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input{font-family:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.chips::-webkit-scrollbar{display:none}
h1,.disp{font-family:'Fraunces',Georgia,serif;font-optical-sizing:auto}
</style>
</helmet>
<div style="width:390px;height:1240px;box-sizing:border-box;background:#111c2c;display:flex;flex-direction:column;overflow:hidden">

  <header style="display:flex;align-items:center;gap:10px;padding:12px 16px;min-height:64px;box-sizing:border-box">
    <h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;font-family:'Fraunces',Georgia,serif">Market</h1>
    <a href="MarketLista.dc.html" style="margin-left:auto;min-height:44px;padding:0 16px;border-radius:14px;background:#0ea5e9;color:#0b1623;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px;stroke-width:2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Vendi</a>
  </header>

  <!-- Tab -->
  <div role="tablist" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0 16px;background:#1a293d;border:1px solid #33486a;border-radius:16px;padding:4px;gap:4px">
    <button role="tab" aria-selected="true" style="min-height:44px;border-radius:12px;border:0;background:#0ea5e9;color:#0b1623;font-weight:800;font-size:14px">Annunci</button>
    <button role="tab" aria-selected="false" style="min-height:44px;border-radius:12px;border:0;background:transparent;color:#cbd5e1;font-weight:600;font-size:14px">Negozi</button>
    <button role="tab" aria-selected="false" style="min-height:44px;border-radius:12px;border:0;background:transparent;color:#cbd5e1;font-weight:600;font-size:14px">eBay</button>
  </div>

  <div style="padding:14px 16px 0;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;gap:8px">
      <label style="position:relative;display:block;flex:1;min-width:0">
        <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#9db0c8;display:flex"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg></span>
        <input type="search" placeholder="Cerca annunci" aria-label="Cerca annunci" style="width:100%;box-sizing:border-box;height:48px;border-radius:14px;border:1px solid #33486a;background:#1a293d;color:#f1f5f9;font-size:15px;padding:0 14px 0 44px;outline:none">
      </label>
      <button aria-label="Filtri, 1 attivo" style="position:relative;width:48px;height:48px;border-radius:14px;border:1px solid #0ea5e9;background:rgba(14,165,233,.16);color:#7dd3fc;display:flex;align-items:center;justify-content:center;flex:none"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span style="position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:999px;background:#f59e0b;color:#1a1204;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #111c2c">1</span></button>
    </div>
    <div class="chips" style="display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none">
      <button style="flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #0ea5e9;background:#0ea5e9;color:#0b1623;font-weight:700;font-size:14px">Tutte</button>
      <button style="flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #33486a;background:#1a293d;color:#cbd5e1;font-weight:600;font-size:14px">Canne</button>
      <button style="flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #33486a;background:#1a293d;color:#cbd5e1;font-weight:600;font-size:14px">Mulinelli</button>
      <button style="flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #33486a;background:#1a293d;color:#cbd5e1;font-weight:600;font-size:14px">Esche</button>
      <button style="flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #33486a;background:#1a293d;color:#cbd5e1;font-weight:600;font-size:14px">Ami e terminali</button>
      <button style="flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #33486a;background:#1a293d;color:#cbd5e1;font-weight:600;font-size:14px">Abbigliamento</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span style="font-size:13px;color:#9db0c8">Filtro attivo:</span>
      <button style="min-height:44px;padding:0 12px 0 14px;border-radius:22px;border:1px solid #0ea5e9;background:rgba(14,165,233,.16);color:#7dd3fc;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px">Usato<svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px" aria-label="Rimuovi filtro" role="img"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </div>

  <main style="flex:1;overflow:hidden;padding:12px 16px 16px">
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <sc-for list="{{items}}" as="l" hint-placeholder-count="6">
      <a href="MarketAnnuncio.dc.html" style="display:flex;flex-direction:column;background:#1a293d;border:1px solid #33486a;border-radius:18px;overflow:hidden">
        <div style="position:relative;aspect-ratio:4/3;background:{{l.tone}};color:#6f89a8;display:flex;align-items:center;justify-content:center">
          <svg class="i" viewBox="0 0 24 24" style="width:34px;height:34px" aria-hidden="true"><path d="M11 3.300 4.500 6.800A2 2 0 0 0 3.500 8.500v7a2 2 0 0 0 1 1.700l6.500 3.500a2 2 0 0 0 2 0l6.500-3.500a2 2 0 0 0 1-1.700v-7a2 2 0 0 0-1-1.700L13 3.300a2 2 0 0 0-2 0Z"/><path d="M3.800 7.800 12 12.500l8.200-4.700M12 12.500v8.800"/></svg>
          <span style="position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:3px 7px;background:{{l.condBg}};color:{{l.condFg}}">{{l.cond}}</span>
          <sc-if value="{{l.shop}}" hint-placeholder-val="{{ false }}"><span style="position:absolute;right:8px;bottom:8px;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:#0b1623;background:#7dd3fc;border-radius:6px;padding:3px 7px"><svg class="i" viewBox="0 0 24 24" style="width:12px;height:12px;stroke-width:2.4" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg>Negozio</span></sc-if>
        </div>
        <div style="padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px">
          <span style="font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:#7dd3fc;letter-spacing:-.02em">{{l.price}}</span>
          <span style="font-size:14px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px">{{l.title}}</span>
          <span style="font-size:12px;color:#9db0c8">{{l.place}}</span>
        </div>
      </a>
      </sc-for>
    </div>
  </main>

  <nav aria-label="Navigazione principale" style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;background:#1a293d;border-top:1px solid #33486a;padding:8px 8px 14px;min-height:68px;box-sizing:border-box">
    <a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;color:#b4c3d6;font-size:11px;font-weight:600"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px" aria-hidden="true"><path d="M4 11.2a2 2 0 0 1 .7-1.5l6-5.2a2 2 0 0 1 2.6 0l6 5.2a2 2 0 0 1 .7 1.5V18a3 3 0 0 1-3 3h-2.5a1 1 0 0 1-1-1v-3.5a1 1 0 0 0-1-1h-1a1 1 0 0 0-1 1V20a1 1 0 0 1-1 1H7a3 3 0 0 1-3-3v-6.8Z"/></svg>Home</a>
    <a href="Uscite.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;color:#b4c3d6;font-size:11px;font-weight:600"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px" aria-hidden="true"><path d="M2.5 12.4c0-3.7 3.7-6.4 8.3-6.4s7.2 2.6 7.2 6.4-3 6.4-7.2 6.4-8.3-2.7-8.3-6.4Z"/><path d="M17.5 12.4l3.4-3.7a.8.8 0 0 1 1.3.5v6.4a.8.8 0 0 1-1.3.5l-3.4-3.7ZM7.2 11h.01"/></svg>Uscite</a>
    <a href="NuovoPost.dc.html" aria-label="Nuovo post" style="display:flex;justify-content:center;margin-top:-30px"><span style="width:56px;height:56px;border-radius:50%;background:#0ea5e9;color:#0b1623;display:flex;align-items:center;justify-content:center;border:4px solid #111c2c;box-shadow:0 6px 18px rgba(14,165,233,.35)"><svg class="i" viewBox="0 0 24 24" style="width:26px;height:26px;stroke-width:2.400" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></a>
    <a href="Community.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;color:#b4c3d6;font-size:11px;font-weight:600"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px" aria-hidden="true"><path d="M6 4h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-6.5l-3.7 3.3a.6.6 0 0 1-1-.45V17H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z"/></svg>Community</a>
    <a href="MarketLista.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;color:#7dd3fc;font-size:11px;font-weight:700"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px" aria-hidden="true"><path d="M5.5 8h13a1 1 0 0 1 1 1.1l-1 9.2a2.5 2.5 0 0 1-2.5 2.2H8a2.5 2.5 0 0 1-2.5-2.2l-1-9.2A1 1 0 0 1 5.500 8Z"/><path d="M8.5 8V7a3.5 3.5 0 0 1 7 0v1"/></svg>Market</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
renderVals() {
  const used = { cond: 'Usato', condBg: '#f59e0b', condFg: '#1a1204' };
  const nu = { cond: 'Nuovo', condBg: '#4ade80', condFg: '#052e16' };
  return { items: [
    { ...used, tone: '#1f3a56', price: '85 €', title: 'Canna spinning 2,70 m 10-40 g', place: 'Ravenna', shop: false },
    { ...used, tone: '#24415c', price: '60 €', title: 'Mulinello 4000 frizione posteriore', place: 'Rimini', shop: false },
    { ...nu, tone: '#243650', price: '14 €', title: 'Set ami e terminali bolentino', place: 'Ancona', shop: true },
    { ...used, tone: '#1f3a56', price: '40 €', title: 'Waders respirabili, taglia 43', place: 'Cesenatico', shop: false },
    { ...used, tone: '#24415c', price: '120 €', title: 'Canna surfcasting 4,20 m', place: 'Pesaro', shop: false },
    { ...used, tone: '#243650', price: '25 €', title: 'Cassetta artificiali, 30 pezzi', place: 'Senigallia', shop: false },
    { ...used, tone: '#1f3a56', price: '18 €', title: 'Guadino telescopico', place: 'Forlì', shop: false },
    { ...used, tone: '#24415c', price: '55 €', title: 'Carrello da pesca pieghevole', place: 'Ravenna', shop: false }
  ] };
}
}
</script>
</body>
</html>
