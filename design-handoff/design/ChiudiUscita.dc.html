<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>FishLog Chiudi uscita</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#111c2c;color:#f1f5f9}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.lab{display:block;margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9db0c8}
.inp{width:100%;box-sizing:border-box;height:52px;border-radius:14px;border:1px solid #33486a;background:#1a293d;color:#f1f5f9;font-size:16px;padding:0 16px;outline:none}
.inp:focus{border-color:#0ea5e9}
.mono{font-family:'JetBrains Mono',monospace}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #33486a;background:#1a293d;color:#cbd5e1;font-weight:600;font-size:15px}
.chip.on{border-color:#0ea5e9;background:#0ea5e9;color:#0b1623;font-weight:800}
.btn1{min-height:54px;border-radius:16px;background:#0ea5e9;color:#0b1623;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;width:100%;box-sizing:border-box}
.btn2{min-height:48px;border-radius:14px;background:transparent;color:#cbd5e1;border:1px solid #46617f;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box}
.bar{padding:12px 16px 20px;background:#1a293d;border-top:1px solid #33486a;display:flex;flex-direction:column;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid #33486a;background:#1a293d;color:#f1f5f9;display:flex;align-items:center;justify-content:center;flex:none}
.card{background:#1a293d;border:1px solid #33486a;border-radius:20px;padding:16px;box-sizing:border-box}
.hint{margin:6px 0 0;font-size:13px;color:#9db0c8}
.seg{display:grid;gap:8px}
.seg button{min-height:44px;border-radius:12px;font-size:14px;font-weight:700}
h1,.disp{font-family:'Fraunces',Georgia,serif;font-optical-sizing:auto}
</style>
</helmet>
<div style="width:390px;height:960px;box-sizing:border-box;background:#111c2c;display:flex;flex-direction:column;overflow:hidden">
  <header style="display:flex;align-items:center;gap:8px;padding:8px 16px 8px 8px;min-height:64px;box-sizing:border-box;border-bottom:1px solid #33486a">
    <a href="UscitaInCorso.dc.html" aria-label="Indietro" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1 style="margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em;flex:1;font-family:'Fraunces',Georgia,serif">Chiudi uscita</h1>
  </header>
  <main style="flex:1;overflow:hidden;padding:20px 16px;display:flex;flex-direction:column;gap:26px">

    <section class="card" style="border-radius:24px 24px 24px 8px;display:flex;flex-direction:column;gap:14px;background:#10304d">
      <div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:20px;font-weight:800;letter-spacing:-.01em;font-family:'Fraunces',Georgia,serif">Molo di Senigallia</span><span class="mono" style="font-size:12px;color:#7dd3fc">43.72°N · 13.22°E · 10 nov 2026</span></div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
        <div style="display:flex;flex-direction:column;gap:2px"><span class="mono" style="font-size:30px;line-height:1;letter-spacing:-.04em">3</span><span style="font-size:12px;color:#b4c3d6;font-weight:600">catture</span></div>
        <div style="display:flex;flex-direction:column;gap:2px"><span class="mono" style="font-size:30px;line-height:1;letter-spacing:-.04em">3,1</span><span style="font-size:12px;color:#b4c3d6;font-weight:600">kg totali</span></div>
        <div style="display:flex;flex-direction:column;gap:2px"><span class="mono" style="font-size:30px;line-height:1;letter-spacing:-.04em;color:#fbbf24">3:20</span><span style="font-size:12px;color:#b4c3d6;font-weight:600">ore</span></div>
      </div>
    </section>

    <section>
      <span class="lab">Com'è andata?</span>
      <div role="radiogroup" aria-label="Voto" style="display:flex;gap:6px">
        <sc-for list="{{stars}}" as="st" hint-placeholder-count="5"><button role="radio" aria-checked="{{st.on}}" aria-label="{{st.label}}" onClick="{{st.tap}}" style="width:52px;height:52px;border-radius:14px;border:1px solid #33486a;background:#1a293d;color:{{st.color}};display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" style="width:28px;height:28px;fill:currentColor" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.9L12 3.5Z"/></svg></button></sc-for>
      </div>
    </section>

    <section>
      <label class="lab" for="nt">Note (facoltative)</label>
      <textarea id="nt" rows="3" placeholder="Esche che hanno funzionato, mare, cosa ricordare…" style="width:100%;box-sizing:border-box;min-height:96px;border-radius:14px;border:1px solid #33486a;background:#1a293d;color:#f1f5f9;font-size:16px;padding:14px 16px;outline:none;resize:none;line-height:1.45"></textarea>
    </section>

    <section>
      <span class="lab">Chi può vederla</span>
      <div class="seg" style="grid-template-columns:repeat(3,minmax(0,1fr))" role="radiogroup" aria-label="Visibilità">
        <sc-for list="{{vis}}" as="v" hint-placeholder-count="3"><button role="radio" aria-checked="{{v.on}}" onClick="{{v.tap}}" style="color:{{v.fg}};background:{{v.bg}};border:1px solid {{v.bd}}">{{v.label}}</button></sc-for>
      </div>
      <p class="hint">{{visHint}}</p>
    </section>
  </main>
  <div class="bar">
    <a href="Dettaglio.dc.html" class="btn1">Chiudi uscita</a>
    <a href="UscitaInCorso.dc.html" class="btn2" style="border:0;min-height:44px;color:#7dd3fc">Continua a pescare</a>
    <p style="margin:0;text-align:center;font-size:12px;color:#9db0c8">Potrai modificarla anche dopo.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { r: 4, v: 1 }; }
renderVals() {
  const s = this.state;
  const labels = ['Solo io', 'Amici', 'Social'];
  const hints = ['Solo tu vedi questa uscita.', 'La vedono i tuoi amici.', 'Compare nel feed dei social.'];
  return {
    stars: [1,2,3,4,5].map((n) => ({ on: s.r === n, label: n + (n === 1 ? ' stella' : ' stelle'), color: n <= s.r ? '#fbbf24' : '#5f7897', tap: () => this.setState({ r: n }) })),
    vis: labels.map((label, i) => s.v === i
      ? { label, on: true, fg: '#0b1623', bg: '#0ea5e9', bd: '#0ea5e9', tap: () => this.setState({ v: i }) }
      : { label, on: false, fg: '#cbd5e1', bg: '#1a293d', bd: '#33486a', tap: () => this.setState({ v: i }) }),
    visHint: hints[s.v]
  };
}
}
</script>
</body>
</html>
