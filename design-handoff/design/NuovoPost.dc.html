<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>FishLog Nuovo post</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#111c2c;color:#f1f5f9}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,textarea{font-family:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.lab{margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9db0c8}
</style>
</helmet>
<div style="width:390px;height:900px;box-sizing:border-box;background:#111c2c;display:flex;flex-direction:column;overflow:hidden">

  <header style="display:flex;align-items:center;gap:8px;padding:12px 16px;min-height:64px;box-sizing:border-box;border-bottom:1px solid #33486a">
    <a href="Community.dc.html" aria-label="Chiudi" style="width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#f1f5f9;margin-left:-8px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    <h1 style="margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em">Nuovo post</h1>
    <a href="Community.dc.html" style="margin-left:auto;min-height:44px;padding:0 20px;border-radius:14px;background:#0ea5e9;color:#0b1623;font-weight:800;font-size:15px;display:flex;align-items:center">Pubblica</a>
  </header>

  <main style="flex:1;overflow:hidden;padding:20px 16px;display:flex;flex-direction:column;gap:24px">

    <!-- Media -->
    <section style="display:flex;flex-direction:column;gap:10px">
      <h2 class="lab">Foto e video</h2>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
        <div style="position:relative;aspect-ratio:1/1;border-radius:16px;background:#1f3a56;color:#6f89a8;display:flex;align-items:center;justify-content:center;border:2px solid #0ea5e9">
          <svg class="i" viewBox="0 0 24 24" style="width:30px;height:30px" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="4"/><circle cx="9" cy="10.5" r="1.8"/><path d="m21 15-3.8-3.8a1.5 1.5 0 0 0-2.1 0L7 19.5"/></svg>
          <span style="position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:800;color:#1a1204;background:#f59e0b;border-radius:999px;padding:2px 8px">Copertina</span>
        </div>
        <div style="position:relative;aspect-ratio:1/1;border-radius:16px;background:#24415c;color:#f1f5f9;display:flex;align-items:center;justify-content:center">
          <svg class="i" viewBox="0 0 24 24" style="width:28px;height:28px;fill:currentColor" aria-hidden="true"><path d="M8.5 5.6v12.8a1 1 0 0 0 1.5.9l10-6.4a1 1 0 0 0 0-1.7L10 4.7a1 1 0 0 0-1.5.9Z"/></svg>
          <span style="position:absolute;right:6px;bottom:6px;font-family:'JetBrains Mono',monospace;font-size:11px;background:rgba(17,28,44,.82);border-radius:999px;padding:2px 8px">0:18</span>
        </div>
        <button aria-label="Aggiungi foto o video" style="aspect-ratio:1/1;border-radius:16px;border:2px dashed #46617f;background:transparent;color:#7dd3fc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700"><svg class="i" viewBox="0 0 24 24" style="stroke-width:2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Aggiungi</button>
      </div>
    </section>

    <!-- Didascalia -->
    <section style="display:flex;flex-direction:column;gap:10px">
      <h2 class="lab"><label for="cap">Didascalia</label></h2>
      <textarea id="cap" rows="3" placeholder="Racconta la cattura: esca, condizioni, com'è andata" style="width:100%;box-sizing:border-box;border-radius:16px;border:1px solid #33486a;background:#1a293d;color:#f1f5f9;font-size:15px;line-height:1.5;padding:14px;resize:none;outline:none">Prima uscita dopo la mareggiata: acqua ancora un po' torbida ma le spigole c'erano.</textarea>
    </section>

    <!-- Uscita collegata -->
    <section style="display:flex;flex-direction:column;gap:10px">
      <h2 class="lab">Uscita collegata</h2>
      <div style="display:flex;align-items:center;gap:12px;background:#1a293d;border:1px solid #0ea5e9;border-radius:16px;padding:12px">
        <span style="width:44px;height:44px;border-radius:12px;background:#243650;color:#7dd3fc;display:flex;align-items:center;justify-content:center;flex:none"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12.4c0-3.7 3.7-6.4 8.3-6.4s7.2 2.6 7.2 6.4-3 6.4-7.2 6.4-8.3-2.7-8.3-6.4Z"/><path d="M17.5 12.4l3.4-3.7a.8.8 0 0 1 1.3.5v6.4a.8.8 0 0 1-1.3.5l-3.4-3.7ZM7.2 11h.01"/></svg></span>
        <span style="display:flex;flex-direction:column;gap:1px;min-width:0;flex:1">
          <span style="font-size:15px;font-weight:700">Surfcasting serale</span>
          <span style="font-size:12px;color:#9db0c8">26 ott · Marina di Ravenna · 2 catture</span>
        </span>
        <button style="min-height:44px;padding:0 12px;border-radius:12px;border:1px solid #33486a;background:transparent;color:#cbd5e1;font-size:13px;font-weight:700">Cambia</button>
      </div>
      <p style="margin:0;font-size:13px;line-height:1.45;color:#9db0c8">Luogo, specie e misure della cattura vengono mostrati sul post. Le coordinate esatte restano nascoste.</p>
    </section>

    <!-- Cattura in evidenza -->
    <section style="display:flex;flex-direction:column;gap:10px">
      <h2 class="lab">Cattura in evidenza</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button style="min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #f59e0b;background:rgba(245,158,11,.14);color:#fbbf24;font-weight:700;font-size:14px">Spigola 52 cm</button>
        <button style="min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #33486a;background:#1a293d;color:#cbd5e1;font-weight:600;font-size:14px">Orata 38 cm</button>
        <button style="min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #33486a;background:#1a293d;color:#cbd5e1;font-weight:600;font-size:14px">Nessuna</button>
      </div>
    </section>

    <!-- Visibilità -->
    <section style="display:flex;flex-direction:column;gap:10px">
      <h2 class="lab">Chi può vederlo</h2>
      <div role="group" aria-label="Visibilità" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#1a293d;border:1px solid #33486a;border-radius:16px;padding:4px;gap:4px">
        <button style="min-height:44px;border-radius:12px;border:0;background:#0ea5e9;color:#0b1623;font-weight:800;font-size:14px">Pubblico</button>
        <button style="min-height:44px;border-radius:12px;border:0;background:transparent;color:#cbd5e1;font-weight:600;font-size:14px">Gruppo</button>
        <button style="min-height:44px;border-radius:12px;border:0;background:transparent;color:#cbd5e1;font-weight:600;font-size:14px">Privato</button>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
