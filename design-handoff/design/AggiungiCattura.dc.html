<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>FishLog Nuova cattura</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#111c2c;color:#f1f5f9}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.lab{display:block;margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9db0c8}
.inp{width:100%;box-sizing:border-box;height:52px;border-radius:14px;border:1px solid #33486a;background:#1a293d;color:#f1f5f9;font-size:16px;padding:0 16px;outline:none}
.inp:focus{border-color:#0ea5e9}
.mono{font-family:'JetBrains Mono',monospace}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #33486a;background:#1a293d;color:#cbd5e1;font-weight:600;font-size:15px}
.chip.on{border-color:#0ea5e9;background:#0ea5e9;color:#0b1623;font-weight:800}
.btn1{min-height:54px;border-radius:16px;background:#0ea5e9;color:#0b1623;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;width:100%;box-sizing:border-box}
.btn2{min-height:48px;border-radius:14px;background:transparent;color:#cbd5e1;border:1px solid #46617f;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box}
.bar{padding:12px 16px 20px;background:#1a293d;border-top:1px solid #33486a;display:flex;flex-direction:column;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid #33486a;background:#1a293d;color:#f1f5f9;display:flex;align-items:center;justify-content:center;flex:none}
.card{background:#1a293d;border:1px solid #33486a;border-radius:20px;padding:16px;box-sizing:border-box}
.hint{margin:6px 0 0;font-size:13px;color:#9db0c8}
.seg{display:grid;gap:8px}
.seg button{min-height:44px;border-radius:12px;font-size:14px;font-weight:700}
h1,.disp{font-family:'Fraunces',Georgia,serif;font-optical-sizing:auto}
</style>
</helmet>
<div style="width:390px;height:1200px;box-sizing:border-box;background:#111c2c;display:flex;flex-direction:column;overflow:hidden">
  <header style="display:flex;align-items:center;gap:8px;padding:8px 16px 8px 8px;min-height:64px;box-sizing:border-box;border-bottom:1px solid #33486a">
    <a href="UscitaInCorso.dc.html" aria-label="Indietro" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1 style="margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em;flex:1">Nuova cattura</h1>
  </header>
  <main style="flex:1;overflow:hidden;padding:20px 16px;display:flex;flex-direction:column;gap:26px">

    <section>
      <span class="lab">Che pesce è?</span>
      <div style="position:relative"><span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#9db0c8;display:flex"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><path d="M18 11a7 7 0 1 1-14 0 7 7 0 0 1 14 0ZM20 20l-3.5-3.5"/></svg></span><input class="inp" aria-label="Cerca specie" placeholder="Cerca la specie" style="padding-left:46px"></div>
      <p class="hint" style="margin-bottom:10px">Le tue più frequenti. Tocca per scegliere.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <sc-for list="{{species}}" as="s" hint-placeholder-count="5"><button class="chip {{s.cls}}" aria-pressed="{{s.on}}" onClick="{{s.tap}}">{{s.label}}</button></sc-for>
      </div>
    </section>

    <section>
      <span class="lab">Misure</span>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <label style="display:flex;flex-direction:column;gap:6px;background:#1a293d;border:1px solid #33486a;border-radius:18px;padding:12px 14px">
          <span style="font-size:13px;color:#9db0c8;font-weight:600">Peso</span>
          <span style="display:flex;align-items:baseline;gap:6px"><input class="mono" inputmode="decimal" value="1,4" aria-label="Peso in chilogrammi" style="width:100%;min-width:0;background:transparent;border:0;outline:none;color:#f1f5f9;font-size:34px;letter-spacing:-.04em;padding:0"><span style="font-size:14px;color:#9db0c8">kg</span></span>
        </label>
        <label style="display:flex;flex-direction:column;gap:6px;background:#1a293d;border:1px solid #33486a;border-radius:18px;padding:12px 14px">
          <span style="font-size:13px;color:#9db0c8;font-weight:600">Lunghezza</span>
          <span style="display:flex;align-items:baseline;gap:6px"><input class="mono" inputmode="decimal" value="52" aria-label="Lunghezza in centimetri" style="width:100%;min-width:0;background:transparent;border:0;outline:none;color:#f1f5f9;font-size:34px;letter-spacing:-.04em;padding:0"><span style="font-size:14px;color:#9db0c8">cm</span></span>
        </label>
      </div>
    </section>

    <section style="display:flex;align-items:center;gap:14px;background:#1a293d;border:1px solid #33486a;border-radius:18px;padding:12px 14px;min-height:64px;box-sizing:border-box">
      <span style="width:40px;height:40px;border-radius:12px;background:rgba(74,222,128,.14);color:#86efac;display:flex;align-items:center;justify-content:center;flex:none"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></svg></span>
      <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:800">Rilasciato</span><span style="font-size:13px;color:#9db0c8">L'hai rimesso in acqua</span></span>
      <button role="switch" aria-checked="{{rel.on}}" onClick="{{rel.tap}}" style="width:52px;height:32px;border-radius:16px;border:0;background:{{rel.track}};position:relative;flex:none;padding:0" aria-label="{{rel.label}}"><span style="position:absolute;top:4px;left:{{rel.knob}}px;width:24px;height:24px;border-radius:50%;background:#fff"></span></button>
    </section>

    <section>
      <span class="lab">Foto</span>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <button style="min-height:84px;border-radius:18px;border:1px dashed #7dd3fc;background:rgba(14,165,233,.08);color:#7dd3fc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px"><svg class="i" viewBox="0 0 24 24" style="width:24px;height:24px;" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2l1.1-1.6A1.5 1.5 0 0 1 10 3.8h4a1.5 1.5 0 0 1 1.2.6L16.3 6h1.2A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5ZM15.2 12.5a3.2 3.2 0 1 1-6.4 0 3.2 3.2 0 0 1 6.4 0Z"/></svg>Scatta</button>
        <button style="min-height:84px;border-radius:18px;border:1px dashed #46617f;background:#1a293d;color:#cbd5e1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px"><svg class="i" viewBox="0 0 24 24" style="width:24px;height:24px;" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2ZM3 16l5-5 4 4 3-3 6 6M9 9h.01"/></svg>Dalla galleria</button>
      </div>
    </section>

    <a href="AggiungiCattura.dc.html" style="display:flex;align-items:center;gap:12px;min-height:56px;color:#f1f5f9;border-top:1px solid #33486a;padding-top:6px">
      <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:700">Altri dettagli</span><span style="font-size:13px;color:#9db0c8">Ora, esca, montatura, distanza, note</span></span><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px;color:#7dd3fc" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </a>
  </main>
  <div class="bar">
    <a href="UscitaInCorso.dc.html" class="btn1">Salva cattura</a>
    <a href="AggiungiCattura.dc.html" class="btn2" style="border:0;min-height:44px;color:#7dd3fc">Salva e aggiungine un'altra</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { sp: 1, rel: true }; }
renderVals() {
  const s = this.state;
  const names = ['Orata', 'Spigola', 'Sgombro', 'Scorfano', 'Cefalo'];
  return {
    species: names.map((label, i) => ({ label: i === 0 ? label + ' · 1 qui' : label, on: s.sp === i, cls: s.sp === i ? 'on' : '', tap: () => this.setState({ sp: i }) })),
    rel: { on: s.rel, track: s.rel ? '#22c55e' : '#46617f', knob: s.rel ? 24 : 4, label: 'Rilasciato', tap: () => this.setState({ rel: !s.rel }) }
  };
}
}
</script>
</body>
</html>
