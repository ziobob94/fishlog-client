<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>FishLog Commenti</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#111c2c;color:#f1f5f9}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input{font-family:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.av{width:36px;height:36px;border-radius:50%;border:1px solid #7dd3fc;background:rgba(14,165,233,.16);color:#7dd3fc;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#111c2c;display:flex;flex-direction:column;overflow:hidden">
  <header style="display:flex;align-items:center;gap:8px;padding:8px 16px 8px 8px;min-height:64px;box-sizing:border-box;border-bottom:1px solid #33486a">
    <a href="Community.dc.html" aria-label="Torna al feed" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1 style="margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em">Commenti</h1>
  </header>

  <main style="flex:1;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;gap:12px;padding-bottom:16px;border-bottom:1px solid #33486a">
      <span class="av" style="width:40px;height:40px;font-size:13px">GR</span>
      <p style="margin:0;font-size:15px;line-height:1.5;color:#e2e8f0"><strong style="font-weight:800">giorgio.r</strong> Prima uscita dopo la mareggiata: acqua ancora un po' torbida ma le spigole c'erano.</p>
    </div>

    <sc-for list="{{comments}}" as="c" hint-placeholder-count="4">
    <div style="display:flex;gap:12px;padding-left:{{c.indent}}px">
      <span class="av">{{c.ini}}</span>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
        <p style="margin:0;font-size:15px;line-height:1.45"><strong style="font-weight:800">{{c.name}}</strong> <span style="color:#cbd5e1">{{c.text}}</span></p>
        <div style="display:flex;gap:4px;align-items:center;font-size:12px;color:#9db0c8"><span>{{c.when}}</span><button style="min-height:44px;padding:0 10px;border:0;background:transparent;color:#9db0c8;font-weight:700;font-size:12px">Rispondi</button></div>
      </div>
      <button aria-label="Mi piace al commento" style="width:44px;height:44px;border:0;background:transparent;color:{{c.heart}};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:11px;font-weight:700;flex:none"><svg class="i" viewBox="0 0 24 24" style="fill:{{c.fill}}" aria-hidden="true"><path d="M12 20s-7.500-4.600-7.500-10A4.300 4.300 0 0 1 12 7.500 4.300 4.300 0 0 1 19.500 10c0 5.400-7.500 10-7.500 10Z"/></svg>{{c.likes}}</button>
    </div>
    </sc-for>
  </main>

  <div style="display:flex;align-items:center;gap:10px;padding:10px 16px 20px;background:#1a293d;border-top:1px solid #33486a">
    <span class="av">MC</span>
    <input type="text" placeholder="Scrivi un commento..." aria-label="Commento" style="flex:1;min-width:0;box-sizing:border-box;height:48px;border-radius:24px;border:1px solid #33486a;background:#111c2c;color:#f1f5f9;font-size:15px;padding:0 18px;outline:none">
    <button style="min-height:48px;padding:0 18px;border-radius:24px;border:0;background:#0ea5e9;color:#0b1623;font-weight:800;font-size:14px">Invia</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  return { comments: [
    { ini: 'LB', name: 'luca_bolentino', text: 'Bella! Che minnow era?', when: '1 h', likes: 3, heart: '#fbbf24', fill: '#fbbf24', indent: 0 },
    { ini: 'GR', name: 'giorgio.r', text: '@luca_bolentino 9 cm, colore argento', when: '58 min', likes: 1, heart: '#9db0c8', fill: 'none', indent: 48 },
    { ini: 'SF', name: 'sara_feeder', text: 'Mi segno il posto, sabato ci faccio un giro', when: '40 min', likes: 0, heart: '#9db0c8', fill: 'none', indent: 0 },
    { ini: 'MS', name: 'marco.surf', text: 'Complimenti per il rilascio della seconda', when: '12 min', likes: 2, heart: '#9db0c8', fill: 'none', indent: 0 }
  ] };
}
}
</script>
</body>
</html>
