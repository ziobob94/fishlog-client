<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>FishLog Amici</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#111c2c;color:#f1f5f9}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input{font-family:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.lab{margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9db0c8}
.av{width:44px;height:44px;border-radius:50%;border:1px solid #7dd3fc;background:rgba(14,165,233,.16);color:#7dd3fc;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.row{display:flex;align-items:center;gap:12px;background:#1a293d;border:1px solid #33486a;border-radius:18px;padding:10px 12px;min-height:64px;box-sizing:border-box}
h1,.disp{font-family:'Fraunces',Georgia,serif;font-optical-sizing:auto}
</style>
</helmet>
<div style="width:390px;height:900px;box-sizing:border-box;background:#111c2c;display:flex;flex-direction:column;overflow:hidden">
  <header style="display:flex;align-items:center;gap:8px;padding:12px 16px 12px 8px;min-height:64px;box-sizing:border-box">
    <a href="Community.dc.html" aria-label="Indietro" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;font-family:'Fraunces',Georgia,serif">Amici</h1>
  </header>
  <main style="flex:1;overflow:hidden;padding:0 16px 16px;display:flex;flex-direction:column;gap:22px">
    <label style="position:relative;display:block"><span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#9db0c8;display:flex"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg></span><input type="search" placeholder="Cerca per nome o email" aria-label="Cerca persone" style="width:100%;box-sizing:border-box;height:52px;border-radius:14px;border:1px solid #33486a;background:#1a293d;color:#f1f5f9;font-size:16px;padding:0 14px 0 44px;outline:none"></label>

    <section style="display:flex;flex-direction:column;gap:10px">
      <h2 class="lab">Richieste ricevute · 2</h2>
      <sc-for list="{{requests}}" as="r" hint-placeholder-count="2">
      <div class="row"><span class="av">{{r.ini}}</span><span style="flex:1;min-width:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.name}}</span>
        <button aria-label="Rifiuta" style="width:44px;height:44px;border-radius:14px;border:1px solid #46617f;background:transparent;color:#cbd5e1;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <button style="min-height:44px;padding:0 16px;border-radius:14px;border:0;background:#0ea5e9;color:#0b1623;font-weight:800;font-size:14px">Accetta</button></div>
      </sc-for>
    </section>

    <section style="display:flex;flex-direction:column;gap:10px">
      <h2 class="lab">Amici · 12</h2>
      <sc-for list="{{friends}}" as="f" hint-placeholder-count="4">
      <div class="row"><a href="ProfiloUtente.dc.html" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0"><span class="av">{{f.ini}}</span><span style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{f.name}}</span></a>
        <a href="ChatThread.dc.html" aria-label="Scrivi a {{f.name}}" style="width:44px;height:44px;border-radius:14px;border:1px solid #33486a;background:#243650;color:#7dd3fc;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-6.5l-3.7 3.3a.6.6 0 0 1-1-.45V17H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z"/></svg></a></div>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() {
  return {
    requests: [{ ini: 'PD', name: 'paolo_d' }, { ini: 'AN', name: 'anna_n' }],
    friends: [{ ini: 'GR', name: 'giorgio.r' }, { ini: 'LB', name: 'luca_bolentino' }, { ini: 'MS', name: 'marco.surf' }, { ini: 'SF', name: 'sara_feeder' }]
  };
}
}
</script>
</body>
</html>
