<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>FishLog Gruppi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#111c2c;color:#f1f5f9}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
h1,.disp{font-family:'Fraunces',Georgia,serif;font-optical-sizing:auto}
</style>
</helmet>
<div style="width:390px;height:900px;box-sizing:border-box;background:#111c2c;display:flex;flex-direction:column;overflow:hidden">
  <header style="display:flex;align-items:center;gap:8px;padding:12px 16px 12px 8px;min-height:64px;box-sizing:border-box">
    <a href="Community.dc.html" aria-label="Indietro" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;font-family:'Fraunces',Georgia,serif">Gruppi</h1>
    <button style="margin-left:auto;min-height:44px;padding:0 16px;border-radius:14px;border:0;background:#0ea5e9;color:#0b1623;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px;stroke-width:2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nuovo gruppo</button>
  </header>
  <main style="flex:1;overflow:hidden;padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
    <a href="Community.dc.html" style="display:flex;flex-direction:column;gap:10px;background:#1a293d;border:1px solid #33486a;border-radius:20px;padding:16px">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="width:48px;height:48px;border-radius:16px;border:1px solid #f59e0b;background:rgba(245,158,11,.14);color:#fbbf24;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none">{{g.ini}}</span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:17px;font-weight:800;letter-spacing:-.01em">{{g.name}}</span><span style="font-size:13px;color:#9db0c8">{{g.members}} membri</span></span>
        <sc-if value="{{g.owner}}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:rgba(14,165,233,.14);color:#7dd3fc">Admin</span></sc-if>
      </div>
      <p style="margin:0;font-size:14px;line-height:1.45;color:#cbd5e1">{{g.desc}}</p>
    </a>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() {
  return { groups: [
    { ini: 'RA', name: 'Ravenna Surfcasting', members: 14, owner: false, desc: 'Uscite serali sulla costa romagnola, condividiamo spot e montature.' },
    { ini: 'UL', name: 'Uscite al lago', members: 6, owner: true, desc: 'Gruppo di amici, organizziamo le giornate a Comacchio.' },
    { ini: 'BC', name: 'Bolentino Conero', members: 9, owner: false, desc: 'Fondali e uscite in barca nella riviera del Conero.' }
  ] };
}
}
</script>
</body>
</html>
