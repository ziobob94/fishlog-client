<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>FishLog Chat conversazione</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#111c2c;color:#f1f5f9}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input{font-family:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:900px;box-sizing:border-box;background:#111c2c;display:flex;flex-direction:column;overflow:hidden;position:relative">

  <header style="display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;min-height:64px;box-sizing:border-box;border-bottom:1px solid #33486a;background:#1a293d">
    <a href="ChatLista.dc.html" aria-label="Torna alle chat" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <span style="position:relative;width:40px;height:40px;border-radius:50%;border:1px solid #7dd3fc;background:rgba(14,165,233,.16);color:#7dd3fc;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none">GR<span style="position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#4ade80;border:2px solid #1a293d"></span></span>
    <span style="display:flex;flex-direction:column;gap:1px;min-width:0;flex:1">
      <span style="font-size:16px;font-weight:800">giorgio.r</span>
      <span style="font-size:12px;color:#86efac">online</span>
    </span>
    <button aria-label="Aggiungi ai preferiti" style="width:44px;height:44px;border:0;background:transparent;color:#fbbf24;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" style="fill:#fbbf24" aria-hidden="true"><path d="M11.100 3.700a1 1 0 0 1 1.800 0L15 8l4.700.7a1 1 0 0 1 .6 1.700l-3.400 3.300.8 4.700a1 1 0 0 1-1.500 1L12 17.200l-4.200 2.200a1 1 0 0 1-1.500-1l.8-4.700L3.700 10.400a1 1 0 0 1 .6-1.700L9 8l2.100-4.300Z"/></svg></button>
  </header>

  <main style="flex:1;overflow:hidden;padding:16px 12px;display:flex;flex-direction:column;gap:6px;justify-content:flex-end">

    <div style="align-self:center;margin:4px 0 10px;font-size:12px;font-weight:700;color:#9db0c8;background:#1a293d;border-radius:999px;padding:5px 12px">Oggi</div>

    <!-- Ricevuto: foto -->
    <div style="align-self:flex-start;max-width:78%;background:#1a293d;border:1px solid #33486a;border-radius:18px 18px 18px 6px;overflow:hidden">
      <div style="width:240px;height:240px;background:#1f3a56;color:#6f89a8;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" style="width:44px;height:44px" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="4"/><circle cx="9" cy="10.5" r="1.8"/><path d="m21 15-3.8-3.8a1.5 1.5 0 0 0-2.1 0L7 19.5"/></svg></div>
      <div style="padding:6px 12px 8px;font-size:11px;color:#9db0c8;text-align:right">13:10</div>
    </div>

    <!-- Ricevuto: testo -->
    <div style="align-self:flex-start;max-width:78%;background:#1a293d;border:1px solid #33486a;border-radius:18px 18px 18px 6px;padding:10px 14px 6px">
      <div style="font-size:15px;line-height:1.45">Spigola da 52, presa sul lato sinistro del molo all'alba</div>
      <div style="font-size:11px;color:#9db0c8;text-align:right;margin-top:2px">13:12</div>
    </div>

    <!-- Mio: testo -->
    <div style="align-self:flex-end;max-width:78%;background:#0ea5e9;color:#0b1623;border-radius:18px 18px 6px 18px;padding:10px 14px 6px">
      <div style="font-size:15px;line-height:1.45;font-weight:500">Bella! Con cosa?</div>
      <div style="font-size:11px;color:#0b3a57;text-align:right;margin-top:2px;display:flex;justify-content:flex-end;gap:4px;align-items:center">13:14 <svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px;stroke-width:2.4" aria-label="Letto" role="img"><path d="m2 13 4 4 8-9M12 15l2 2 8-9"/></svg></div>
    </div>

    <!-- Ricevuto: vocale -->
    <div style="align-self:flex-start;width:250px;background:#1a293d;border:1px solid #33486a;border-radius:18px 18px 18px 6px;padding:8px 14px 6px">
      <div style="display:flex;align-items:center;gap:10px">
        <button aria-label="Riproduci vocale" style="width:44px;height:44px;border-radius:50%;border:0;background:#0ea5e9;color:#0b1623;display:flex;align-items:center;justify-content:center;flex:none"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor" aria-hidden="true"><path d="M8.5 5.6v12.8a1 1 0 0 0 1.5.9l10-6.4a1 1 0 0 0 0-1.7L10 4.7a1 1 0 0 0-1.5.9Z"/></svg></button>
        <div aria-hidden="true" style="flex:1;display:flex;align-items:center;gap:3px;height:32px">
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="20"><span style="width:3px;border-radius:2px;background:#7dd3fc;height:{{b}}px"></span></sc-for>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#9db0c8;margin-top:2px"><span style="font-family:'JetBrains Mono',monospace">0:24</span><span>13:15</span></div>
    </div>

    <!-- Mio: posizione -->
    <div style="align-self:flex-end;width:250px;background:#0ea5e9;border-radius:18px 18px 6px 18px;padding:6px;box-sizing:border-box">
      <div style="height:120px;border-radius:14px;background:#0b6fa0;color:#bae6fd;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" style="width:34px;height:34px" aria-hidden="true"><path d="M12 21s-7-6.200-7-11a7 7 0 0 1 14 0c0 4.800-7 11-7 11Z"/><circle cx="12" cy="10" r="2.500"/></svg></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 8px 2px;color:#0b1623">
        <span style="font-size:14px;font-weight:700">Apri in Maps</span><span style="font-size:11px;color:#0b3a57">13:18</span>
      </div>
    </div>

    <!-- Ricevuto: testo modificato -->
    <div style="align-self:flex-start;max-width:78%;background:#1a293d;border:1px solid #33486a;border-radius:18px 18px 18px 6px;padding:10px 14px 6px">
      <div style="font-size:15px;line-height:1.45">Minnow da 9 cm, ti mando i dettagli stasera</div>
      <div style="font-size:11px;color:#9db0c8;text-align:right;margin-top:2px">modificato · 13:20</div>
    </div>
  </main>

  <!-- Menu allegati -->
  <sc-if value="{{attachOpen}}" hint-placeholder-val="{{ true }}">
  <div style="position:absolute;left:12px;bottom:76px;width:232px;background:#243650;border:1px solid #46617f;border-radius:18px;padding:6px;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.45)">
    <button style="min-height:48px;border:0;background:transparent;color:#f1f5f9;border-radius:12px;display:flex;align-items:center;gap:12px;padding:0 12px;font-size:15px;font-weight:600"><svg class="i" viewBox="0 0 24 24" style="color:#7dd3fc" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="4"/><circle cx="9" cy="10.5" r="1.8"/><path d="m21 15-3.8-3.8a1.5 1.5 0 0 0-2.1 0L7 19.5"/></svg>Foto o video</button>
    <button style="min-height:48px;border:0;background:transparent;color:#f1f5f9;border-radius:12px;display:flex;align-items:center;gap:12px;padding:0 12px;font-size:15px;font-weight:600"><svg class="i" viewBox="0 0 24 24" style="color:#7dd3fc" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/></svg>File</button>
    <button style="min-height:48px;border:0;background:transparent;color:#f1f5f9;border-radius:12px;display:flex;align-items:center;gap:12px;padding:0 12px;font-size:15px;font-weight:600"><svg class="i" viewBox="0 0 24 24" style="color:#7dd3fc" aria-hidden="true"><path d="M12 21s-7-6.200-7-11a7 7 0 0 1 14 0c0 4.800-7 11-7 11Z"/><circle cx="12" cy="10" r="2.500"/></svg>Posizione</button>
    <button style="min-height:48px;border:0;background:transparent;color:#f1f5f9;border-radius:12px;display:flex;align-items:center;gap:12px;padding:0 12px;font-size:15px;font-weight:600"><svg class="i" viewBox="0 0 24 24" style="color:#fbbf24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Registra vocale</button>
  </div>
  </sc-if>

  <!-- Composer -->
  <div style="display:flex;align-items:center;gap:8px;padding:10px 12px 18px;background:#1a293d;border-top:1px solid #33486a">
    <button onClick="{{toggleAttach}}" aria-label="Allega" aria-expanded="{{attachOpen}}" style="width:48px;height:48px;border-radius:50%;border:1px solid #33486a;background:#243650;color:#f1f5f9;display:flex;align-items:center;justify-content:center;flex:none"><svg class="i" viewBox="0 0 24 24" style="stroke-width:2.200" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <input type="text" placeholder="Scrivi un messaggio..." aria-label="Messaggio" style="flex:1;min-width:0;box-sizing:border-box;height:48px;border-radius:24px;border:1px solid #33486a;background:#111c2c;color:#f1f5f9;font-size:15px;padding:0 18px;outline:none">
    <button aria-label="Registra vocale" style="width:48px;height:48px;border-radius:50%;border:0;background:#0ea5e9;color:#0b1623;display:flex;align-items:center;justify-content:center;flex:none"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { attachOpen: true }; }
renderVals() {
  return {
    attachOpen: this.state.attachOpen,
    toggleAttach: () => this.setState({ attachOpen: !this.state.attachOpen }),
    bars: [8, 14, 22, 12, 26, 18, 10, 24, 28, 16, 8, 20, 26, 12, 18, 24, 10, 14, 8, 12]
  };
}
}
</script>
</body>
</html>
