<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>FishLog Nuovo gruppo chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#111c2c;color:#f1f5f9}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input{font-family:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.lab{display:block;margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9db0c8}
.av{width:44px;height:44px;border-radius:50%;border:1px solid #7dd3fc;background:rgba(14,165,233,.16);color:#7dd3fc;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
h1,.disp{font-family:'Fraunces',Georgia,serif;font-optical-sizing:auto}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#111c2c;display:flex;flex-direction:column;overflow:hidden">
  <header style="display:flex;align-items:center;gap:8px;padding:8px 16px 8px 8px;min-height:64px;box-sizing:border-box;border-bottom:1px solid #33486a">
    <a href="ChatLista.dc.html" aria-label="Indietro" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1 style="margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em;font-family:'Fraunces',Georgia,serif">Nuovo gruppo chat</h1>
  </header>
  <main style="flex:1;overflow:hidden;padding:20px 16px;display:flex;flex-direction:column;gap:20px">
    <section><label class="lab" for="g">Nome del gruppo</label><input id="g" value="Uscite al lago" style="width:100%;box-sizing:border-box;height:52px;border-radius:14px;border:1px solid #0ea5e9;background:#1a293d;color:#f1f5f9;font-size:16px;padding:0 16px;outline:none"></section>
    <section style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="lab" style="margin:0">Aggiungi almeno due amici</span><span style="font-size:13px;font-weight:700;color:#7dd3fc">2 selezionati</span></div>
      <sc-for list="{{friends}}" as="f" hint-placeholder-count="4">
      <label style="display:flex;align-items:center;gap:12px;background:{{f.bg}};border:1px solid {{f.bd}};border-radius:18px;padding:10px 14px;min-height:64px;box-sizing:border-box;cursor:pointer">
        <span class="av">{{f.ini}}</span>
        <span style="flex:1;font-size:15px;font-weight:700">{{f.name}}</span>
        <input type="checkbox" checked="{{f.on}}" style="width:24px;height:24px;accent-color:#0ea5e9">
      </label>
      </sc-for>
    </section>
  </main>
  <div style="padding:12px 16px 20px;background:#1a293d;border-top:1px solid #33486a"><a href="ChatLista.dc.html" style="min-height:54px;border-radius:16px;background:#0ea5e9;color:#0b1623;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center">Crea gruppo</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  const on = { bg: 'rgba(14,165,233,.12)', bd: '#0ea5e9', on: true };
  const off = { bg: '#1a293d', bd: '#33486a', on: false };
  return { friends: [
    { ...on, ini: 'GR', name: 'giorgio.r' }, { ...on, ini: 'LB', name: 'luca_bolentino' },
    { ...off, ini: 'MS', name: 'marco.surf' }, { ...off, ini: 'SF', name: 'sara_feeder' }
  ] };
}
}
</script>
</body>
</html>
