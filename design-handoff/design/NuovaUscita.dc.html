<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>FishLog Nuova uscita</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#111c2c;color:#f1f5f9}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.lab{display:block;margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9db0c8}
.inp{width:100%;box-sizing:border-box;height:52px;border-radius:14px;border:1px solid #33486a;background:#1a293d;color:#f1f5f9;font-size:16px;padding:0 16px;outline:none}
.inp:focus{border-color:#0ea5e9}
.mono{font-family:'JetBrains Mono',monospace}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #33486a;background:#1a293d;color:#cbd5e1;font-weight:600;font-size:15px}
.chip.on{border-color:#0ea5e9;background:#0ea5e9;color:#0b1623;font-weight:800}
.btn1{min-height:54px;border-radius:16px;background:#0ea5e9;color:#0b1623;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;width:100%;box-sizing:border-box}
.btn2{min-height:48px;border-radius:14px;background:transparent;color:#cbd5e1;border:1px solid #46617f;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box}
.bar{padding:12px 16px 20px;background:#1a293d;border-top:1px solid #33486a;display:flex;flex-direction:column;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid #33486a;background:#1a293d;color:#f1f5f9;display:flex;align-items:center;justify-content:center;flex:none}
.card{background:#1a293d;border:1px solid #33486a;border-radius:20px;padding:16px;box-sizing:border-box}
.hint{margin:6px 0 0;font-size:13px;color:#9db0c8}
.seg{display:grid;gap:8px}
.seg button{min-height:44px;border-radius:12px;font-size:14px;font-weight:700}
h1,.disp{font-family:'Fraunces',Georgia,serif;font-optical-sizing:auto}
</style>
</helmet>
<div style="width:390px;height:980px;box-sizing:border-box;background:#111c2c;display:flex;flex-direction:column;overflow:hidden">
  <header style="display:flex;align-items:center;gap:8px;padding:8px 16px 8px 8px;min-height:64px;box-sizing:border-box;border-bottom:1px solid #33486a">
    <a href="Uscite.dc.html" aria-label="Indietro" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1 style="margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em;flex:1">Nuova uscita</h1>
  </header>
  <main style="flex:1;overflow:hidden;padding:20px 16px;display:flex;flex-direction:column;gap:24px">

    <button style="display:flex;align-items:center;gap:12px;text-align:left;background:rgba(14,165,233,.10);border:1px solid #0ea5e9;border-radius:18px;padding:12px 14px;min-height:64px;color:#f1f5f9;width:100%;box-sizing:border-box">
      <span style="width:40px;height:40px;border-radius:12px;background:rgba(14,165,233,.18);color:#7dd3fc;display:flex;align-items:center;justify-content:center;flex:none"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg></span>
      <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:800">Rileva luogo e meteo</span><span style="font-size:13px;color:#b4c3d6;line-height:1.35">Usa la tua posizione per compilare luogo, acqua e meteo.</span></span>
      <svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px;color:#7dd3fc" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </button>

    <section>
      <label class="lab" for="lg">Dove</label>
      <div style="position:relative"><span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#9db0c8;display:flex"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11ZM14.5 10a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Z"/></svg></span><input id="lg" class="inp" value="Molo di Senigallia" style="padding-left:46px"></div>
      <p class="hint"><span class="mono" style="color:#7dd3fc">43.72°N · 13.22°E</span> · posizione rilevata</p>
    </section>

    <section>
      <span class="lab">Quando</span>
      <div style="display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px">
        <input aria-label="Data" class="inp" type="date" value="2026-11-10">
        <input aria-label="Ora di inizio" class="inp" type="time" value="22:10">
      </div>
      <button role="switch" aria-checked="{{past.on}}" onClick="{{togglePast}}" style="margin-top:10px;display:flex;align-items:center;gap:12px;min-height:48px;width:100%;background:transparent;border:0;color:#cbd5e1;font-size:15px;font-weight:600;text-align:left;padding:0">
        <span style="width:48px;height:28px;border-radius:14px;background:{{past.track}};position:relative;flex:none"><span style="position:absolute;top:3px;left:{{past.knob}}px;width:22px;height:22px;border-radius:50%;background:#fff"></span></span>
        Uscita già conclusa
      </button>
      <sc-if value="{{past.on}}" hint-placeholder-val="{{ false }}"><div style="margin-top:6px"><label class="lab" for="fine">Ora di fine</label><input id="fine" class="inp" type="time" value="01:40"></div></sc-if>
    </section>

    <section>
      <span class="lab">Dove peschi</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <sc-for list="{{waters}}" as="w" hint-placeholder-count="4"><button class="chip {{w.cls}}" aria-pressed="{{w.on}}" onClick="{{w.tap}}">{{w.label}}</button></sc-for>
      </div>
    </section>

    <section>
      <span class="lab">Tecnica</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <sc-for list="{{techs}}" as="t" hint-placeholder-count="5"><button class="chip {{t.cls}}" aria-pressed="{{t.on}}" onClick="{{t.tap}}">{{t.label}}</button></sc-for>
      </div>
    </section>
  </main>
  <div class="bar">
    <a href="{{cta.href}}" class="btn1">{{cta.label}}</a>
    <p style="margin:0;text-align:center;font-size:13px;color:#9db0c8">Acqua, meteo e note li aggiungi dopo, quando vuoi.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { past: false, water: 0, tech: 1 }; }
renderVals() {
  const s = this.state;
  const mk = (arr, key) => arr.map((label, i) => ({ label, on: s[key] === i, cls: s[key] === i ? 'on' : '', tap: () => this.setState({ [key]: i }) }));
  return {
    waters: mk(['Mare', 'Fiume', 'Lago', 'Altro'], 'water'),
    techs: mk(['Surfcasting', 'Spinning', 'Bolentino', 'Feeder', 'Altro'], 'tech'),
    past: { on: s.past, track: s.past ? '#0ea5e9' : '#46617f', knob: s.past ? 23 : 3 },
    togglePast: () => this.setState({ past: !s.past }),
    cta: s.past ? { label: 'Salva uscita', href: 'Dettaglio.dc.html' } : { label: 'Inizia a pescare', href: 'UscitaInCorso.dc.html' }
  };
}
}
</script>
</body>
</html>
