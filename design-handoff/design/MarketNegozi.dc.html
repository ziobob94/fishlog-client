<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>FishLog Market negozi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#111c2c;color:#f1f5f9}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input{font-family:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.nv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;color:#b4c3d6;font-size:11px;font-weight:600}
h1,.disp{font-family:'Fraunces',Georgia,serif;font-optical-sizing:auto}
</style>
</helmet>
<div style="width:390px;height:900px;box-sizing:border-box;background:#111c2c;display:flex;flex-direction:column;overflow:hidden">
  <header style="display:flex;align-items:center;gap:10px;padding:12px 16px;min-height:64px;box-sizing:border-box">
    <h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;font-family:'Fraunces',Georgia,serif">Market</h1>
    <a href="NuovoAnnuncio.dc.html" style="margin-left:auto;min-height:44px;padding:0 16px;border-radius:14px;background:#0ea5e9;color:#0b1623;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px;stroke-width:2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Vendi</a>
  </header>
  <div role="tablist" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0 16px;background:#1a293d;border:1px solid #33486a;border-radius:16px;padding:4px;gap:4px">
    <button role="tab" aria-selected="false" style="min-height:44px;border-radius:12px;border:0;background:transparent;color:#cbd5e1;font-weight:600;font-size:14px">Annunci</button>
    <button role="tab" aria-selected="true" style="min-height:44px;border-radius:12px;border:0;background:#0ea5e9;color:#0b1623;font-weight:800;font-size:14px">Negozi</button>
    <button role="tab" aria-selected="false" style="min-height:44px;border-radius:12px;border:0;background:transparent;color:#cbd5e1;font-weight:600;font-size:14px">eBay</button>
  </div>
  <main style="flex:1;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:12px">
    <label style="position:relative;display:block"><span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#9db0c8;display:flex"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg></span><input type="search" placeholder="Cerca negozio" aria-label="Cerca negozio" style="width:100%;box-sizing:border-box;height:48px;border-radius:14px;border:1px solid #33486a;background:#1a293d;color:#f1f5f9;font-size:15px;padding:0 14px 0 44px;outline:none"></label>
    <sc-for list="{{shops}}" as="s" hint-placeholder-count="4">
    <a href="MarketLista.dc.html" style="display:flex;flex-direction:column;gap:10px;background:#1a293d;border:1px solid #33486a;border-radius:20px;padding:16px">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="width:52px;height:52px;border-radius:50%;border:1px solid #7dd3fc;background:rgba(14,165,233,.16);color:#7dd3fc;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;flex:none">{{s.ini}}</span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-size:17px;font-weight:800;letter-spacing:-.01em;font-family:'Fraunces',Georgia,serif">{{s.name}}</span>
          <span style="display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:#0b1623;background:#7dd3fc;border-radius:6px;padding:2px 7px;align-self:flex-start"><svg class="i" viewBox="0 0 24 24" style="width:12px;height:12px;stroke-width:2.4" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg>Verificato</span></span>
        <span style="font-size:13px;font-weight:700;color:#fbbf24;background:rgba(245,158,11,.12);padding:4px 10px;border-radius:999px;flex:none">{{s.count}} annunci</span>
      </div>
      <p style="margin:0;font-size:14px;line-height:1.45;color:#9db0c8">{{s.desc}}</p>
    </a>
    </sc-for>
  </main>
  <nav aria-label="Navigazione principale" style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;background:#1a293d;border-top:1px solid #33486a;padding:8px 8px 14px;min-height:68px;box-sizing:border-box">
    <a href="Main.dc.html" class="nv"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.2a2 2 0 0 1 .7-1.5l6-5.2a2 2 0 0 1 2.6 0l6 5.2a2 2 0 0 1 .7 1.5V18a3 3 0 0 1-3 3h-2.5a1 1 0 0 1-1-1v-3.5a1 1 0 0 0-1-1h-1a1 1 0 0 0-1 1V20a1 1 0 0 1-1 1H7a3 3 0 0 1-3-3v-6.8Z"/></svg>Home</a>
    <a href="Uscite.dc.html" class="nv"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12.4c0-3.7 3.7-6.4 8.3-6.4s7.2 2.6 7.2 6.4-3 6.4-7.2 6.4-8.3-2.7-8.3-6.4Z"/><path d="M17.5 12.4l3.4-3.7a.8.8 0 0 1 1.3.5v6.4a.8.8 0 0 1-1.3.5l-3.4-3.7ZM7.2 11h.01"/></svg>Uscite</a>
    <a href="Crea.dc.html" aria-label="Crea" style="display:flex;justify-content:center;margin-top:-30px"><span style="width:56px;height:56px;border-radius:50%;background:#0ea5e9;color:#0b1623;display:flex;align-items:center;justify-content:center;border:4px solid #111c2c;box-shadow:0 6px 18px rgba(14,165,233,.35)"><svg class="i" viewBox="0 0 24 24" style="width:26px;height:26px;stroke-width:2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></a>
    <a href="Community.dc.html" class="nv"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-6.5l-3.7 3.3a.6.6 0 0 1-1-.45V17H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z"/></svg>Social</a>
    <a href="MarketLista.dc.html" class="nv" style="color:#7dd3fc;font-weight:700"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8h13a1 1 0 0 1 1 1.1l-1 9.2a2.5 2.5 0 0 1-2.5 2.2H8a2.5 2.5 0 0 1-2.5-2.2l-1-9.2A1 1 0 0 1 5.500 8Z"/><path d="M8.5 8V7a3.5 3.5 0 0 1 7 0v1"/></svg>Market</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() {
  return { shops: [
    { ini: 'NP', name: '[Nome negozio]', count: 24, desc: '[Descrizione del negozio, due righe al massimo]' },
    { ini: 'NP', name: '[Nome negozio]', count: 12, desc: '[Descrizione del negozio, due righe al massimo]' },
    { ini: 'NP', name: '[Nome negozio]', count: 8, desc: '[Descrizione del negozio, due righe al massimo]' }
  ] };
}
}
</script>
</body>
</html>
