<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>FishLog Profilo utente</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#111c2c;color:#f1f5f9}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.lab{margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9db0c8}
h1,.disp{font-family:'Fraunces',Georgia,serif;font-optical-sizing:auto}
</style>
</helmet>
<div style="width:390px;height:1240px;box-sizing:border-box;background:#111c2c;display:flex;flex-direction:column;overflow:hidden">
  <header style="display:flex;align-items:center;gap:8px;padding:12px 16px 12px 8px;min-height:64px;box-sizing:border-box">
    <a href="Community.dc.html" aria-label="Indietro" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <span style="font-size:16px;font-weight:800">giorgio.r</span>
  </header>

  <main style="flex:1;overflow:hidden;padding:0 16px 16px;display:flex;flex-direction:column;gap:22px">
    <section style="display:flex;align-items:center;gap:16px">
      <span style="width:84px;height:84px;border-radius:50%;border:2px solid #7dd3fc;background:rgba(14,165,233,.16);color:#7dd3fc;font-weight:800;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none;font-family:'Fraunces',Georgia,serif">GR</span>
      <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
        <h1 style="margin:0;font-size:24px;letter-spacing:-.01em;font-weight:800;font-family:'Fraunces',Georgia,serif">Giorgio R.</h1>
        <span style="font-size:13px;color:#9db0c8">Su FishLog dal marzo 2026</span>
      </div>
    </section>

    <section style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#1a293d;border:1px solid #33486a;border-radius:18px;overflow:hidden">
      <div style="padding:12px;display:flex;flex-direction:column;gap:2px"><span style="font-family:'JetBrains Mono',monospace;font-size:24px">18</span><span style="font-size:12px;color:#9db0c8">Uscite</span></div>
      <div style="padding:12px;display:flex;flex-direction:column;gap:2px;border-left:1px solid #33486a"><span style="font-family:'JetBrains Mono',monospace;font-size:24px">64</span><span style="font-size:12px;color:#9db0c8">Catture</span></div>
      <div style="padding:12px;display:flex;flex-direction:column;gap:2px;border-left:1px solid #33486a"><span style="font-family:'JetBrains Mono',monospace;font-size:24px">12</span><span style="font-size:12px;color:#9db0c8">Amici</span></div>
    </section>

    <section style="display:flex;gap:10px">
      <a href="ChatThread.dc.html" style="flex:1;min-height:48px;border-radius:14px;background:#0ea5e9;color:#0b1623;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-6.5l-3.7 3.3a.6.6 0 0 1-1-.45V17H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z"/></svg>Messaggio</a>
      <button style="flex:1;min-height:48px;border-radius:14px;border:1px solid #46617f;background:#1a293d;color:#f1f5f9;font-weight:700;font-size:15px">Amici ✓</button>
    </section>

    <section style="display:flex;flex-direction:column;gap:10px">
      <h2 class="lab">Gruppi in comune</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><span style="padding:8px 14px;border-radius:999px;background:rgba(245,158,11,.12);border:1px solid #f59e0b;color:#fbbf24;font-size:14px;font-weight:700">Ravenna Surfcasting</span><span style="padding:8px 14px;border-radius:999px;background:rgba(245,158,11,.12);border:1px solid #f59e0b;color:#fbbf24;font-size:14px;font-weight:700">Uscite al lago</span></div>
    </section>

    <section style="display:flex;flex-direction:column;gap:10px">
      <div role="tablist" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:#1a293d;border:1px solid #33486a;border-radius:16px;padding:4px;gap:4px">
        <button role="tab" aria-selected="true" style="min-height:44px;border-radius:12px;border:0;background:#0ea5e9;color:#0b1623;font-weight:800;font-size:14px">Post</button>
        <button role="tab" aria-selected="false" style="min-height:44px;border-radius:12px;border:0;background:transparent;color:#cbd5e1;font-weight:600;font-size:14px">Uscite pubbliche</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px">
        <sc-for list="{{tiles}}" as="t" hint-placeholder-count="9">
        <a href="Community.dc.html" style="position:relative;aspect-ratio:1/1;background:{{t.tone}};color:#6f89a8;display:flex;align-items:center;justify-content:center">
          <svg class="i" viewBox="0 0 24 24" style="width:26px;height:26px" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="4"/><circle cx="9" cy="10.5" r="1.8"/><path d="m21 15-3.8-3.8a1.5 1.5 0 0 0-2.1 0L7 19.5"/></svg>
          <sc-if value="{{t.video}}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:6px;right:6px;color:#f1f5f9"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px;fill:currentColor" aria-label="Video" role="img"><path d="M8.5 5.6v12.8a1 1 0 0 0 1.5.9l10-6.4a1 1 0 0 0 0-1.7L10 4.7a1 1 0 0 0-1.5.9Z"/></svg></span></sc-if>
        </a>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
renderVals() {
  const t = ['#1f3a56', '#24415c', '#243650'];
  return { tiles: Array.from({ length: 12 }, (_, i) => ({ tone: t[i % 3], video: i === 2 || i === 7 })) };
}
}
</script>
</body>
</html>
