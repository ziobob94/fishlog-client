<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>FishLog Nuova storia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#111c2c;color:#f1f5f9}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.lab{display:block;margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9db0c8}
.inp{width:100%;box-sizing:border-box;height:52px;border-radius:14px;border:1px solid #33486a;background:#1a293d;color:#f1f5f9;font-size:16px;padding:0 16px;outline:none}
.inp:focus{border-color:#0ea5e9}
.mono{font-family:'JetBrains Mono',monospace}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #33486a;background:#1a293d;color:#cbd5e1;font-weight:600;font-size:15px}
.chip.on{border-color:#0ea5e9;background:#0ea5e9;color:#0b1623;font-weight:800}
.btn1{min-height:54px;border-radius:16px;background:#0ea5e9;color:#0b1623;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;width:100%;box-sizing:border-box}
.btn2{min-height:48px;border-radius:14px;background:transparent;color:#cbd5e1;border:1px solid #46617f;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box}
.bar{padding:12px 16px 20px;background:#1a293d;border-top:1px solid #33486a;display:flex;flex-direction:column;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid #33486a;background:#1a293d;color:#f1f5f9;display:flex;align-items:center;justify-content:center;flex:none}
.card{background:#1a293d;border:1px solid #33486a;border-radius:20px;padding:16px;box-sizing:border-box}
.hint{margin:6px 0 0;font-size:13px;color:#9db0c8}
.seg{display:grid;gap:8px}
.seg button{min-height:44px;border-radius:12px;font-size:14px;font-weight:700}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#0b1623;color:#f1f5f9">
  <div style="position:absolute;inset:0;background:linear-gradient(160deg,#1f3a56,#0b1623 70%)"><svg width="100%" height="100%" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0" aria-hidden="true"><g fill="none" stroke="#7dd3fc" stroke-width="1.5"><path opacity=".10" d="M250-10c80 0 160 45 170 120s-40 140-120 150-170-20-190-100S170-10 250-10Z"/><path opacity=".16" d="M255 14c60 0 125 38 132 96s-30 110-95 124-135-12-152-80S198 14 255 14Z"/><path opacity=".24" d="M260 40c40 0 80 30 85 70s-20 80-70 90-100-10-110-55 55-105 95-105Z"/></g></svg></div>
  <div style="position:absolute;left:0;right:0;top:0;padding:16px;display:flex;align-items:center;gap:8px;background:linear-gradient(rgba(11,22,35,.7),rgba(11,22,35,0))">
    <a href="Crea.dc.html" aria-label="Chiudi" style="width:48px;height:48px;border-radius:50%;background:rgba(11,22,35,.62);display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    <span style="margin-left:auto;display:flex;flex-direction:column;gap:10px"><button aria-label="Testo" style="width:48px;height:48px;border-radius:50%;border:0;background:rgba(11,22,35,.62);color:#f1f5f9;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v10l-5 5H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2ZM16 21v-4a1 1 0 0 1 1-1h4M7 9h10M7 13h6"/></svg></button><button aria-label="Adesivo cattura" style="width:48px;height:48px;border-radius:50%;border:0;background:rgba(11,22,35,.62);color:#f1f5f9;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><path d="M2.5 12.4c0-3.7 3.7-6.4 8.3-6.4s7.2 2.6 7.2 6.4-3 6.4-7.2 6.4-8.3-2.7-8.3-6.4ZM17.5 12.4l3.4-3.7a.8.8 0 0 1 1.3.5v6.4a.8.8 0 0 1-1.3.5l-3.4-3.7ZM7.2 11h.01"/></svg></button><button aria-label="Adesivo luogo" style="width:48px;height:48px;border-radius:50%;border:0;background:rgba(11,22,35,.62);color:#f1f5f9;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11ZM14.5 10a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Z"/></svg></button><button aria-label="Adesivo acqua e meteo" style="width:48px;height:48px;border-radius:50%;border:0;background:rgba(11,22,35,.62);color:#f1f5f9;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px;" aria-hidden="true"><path d="M2 8c2.5 0 2.5 2 5 2s2.5-2 5-2 2.5 2 5 2 2.5-2 5-2M2 14c2.5 0 2.5 2 5 2s2.5-2 5-2 2.5 2 5 2 2.5-2 5-2"/></svg></button></span>
  </div>
  <sc-if value="{{edit}}" hint-placeholder-val="{ true }">
    <div style="position:absolute;left:24px;top:300px;transform:rotate(-4deg);background:#f59e0b;color:#1a1204;border-radius:24px 24px 24px 8px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;box-shadow:0 8px 24px rgba(0,0,0,.4)"><span style="font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase">Abboccata!</span><span class="mono" style="font-size:22px;font-weight:700">Spigola · 52 cm</span><span class="mono" style="font-size:12px">43.72°N · 13.22°E</span></div>
  </sc-if>
  <sc-if value="{{cam}}" hint-placeholder-val="{ false }">
    <div style="position:absolute;left:0;right:0;bottom:0;padding:16px 16px 34px;display:flex;flex-direction:column;align-items:center;gap:18px;background:linear-gradient(rgba(11,22,35,0),rgba(11,22,35,.85))">
      <div style="display:flex;gap:6px" role="tablist"><sc-for list="{{modes}}" as="m" hint-placeholder-count="3"><button role="tab" aria-selected="{{m.on}}" style="min-height:44px;padding:0 16px;border-radius:22px;border:0;background:{{m.bg}};color:{{m.fg}};font-weight:700;font-size:14px">{{m.label}}</button></sc-for></div>
      <div style="display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 20px;box-sizing:border-box">
        <button aria-label="Galleria" style="width:56px;height:56px;border-radius:16px;border:1px solid #7dd3fc;background:rgba(11,22,35,.62);color:#7dd3fc;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" style="width:26px;height:26px;" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2ZM3 16l5-5 4 4 3-3 6 6M9 9h.01"/></svg></button>
        <button onClick="{{shoot}}" aria-label="Scatta" style="width:80px;height:80px;border-radius:50%;border:4px solid #f1f5f9;background:transparent;padding:0;display:flex;align-items:center;justify-content:center"><span style="width:62px;height:62px;border-radius:50%;background:#f1f5f9"></span></button>
        <button aria-label="Cambia fotocamera" style="width:56px;height:56px;border-radius:50%;border:0;background:rgba(11,22,35,.62);color:#f1f5f9;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" style="width:26px;height:26px;" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></svg></button>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{edit}}" hint-placeholder-val="{ true }">
    <div style="position:absolute;left:0;right:0;bottom:0;background:#1a293d;border-radius:28px 28px 0 0;border-top:1px solid #46617f;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px">
      <div><span class="lab">Chi la vede</span>
        <div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))" role="radiogroup" aria-label="Pubblico"><sc-for list="{{audList}}" as="au" hint-placeholder-count="2"><button role="radio" aria-checked="{{au.on}}" onClick="{{au.tap}}" style="color:{{au.fg}};background:{{au.bg}};border:1px solid {{au.bd}}">{{au.label}}</button></sc-for></div></div>
      <p class="hint" style="margin:0">Resta visibile per 24 ore, poi sparisce. Puoi salvarla nell'uscita.</p>
      <a href="Community.dc.html" class="btn1">Pubblica la storia</a>
      <button onClick="{{back}}" class="btn2" style="border:0;min-height:44px;color:#7dd3fc">Rifai</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { step: 1, aud: 0 }; }
renderVals() {
  const s = this.state;
  const labels = ['Tutti', 'Solo amici'];
  return {
    cam: s.step === 0, edit: s.step === 1,
    modes: ['Foto', 'Video', 'Testo'].map((label, i) => ({ label, on: i === 0, bg: i === 0 ? '#f1f5f9' : 'rgba(11,22,35,.62)', fg: i === 0 ? '#0b1623' : '#f1f5f9' })),
    shoot: () => this.setState({ step: 1 }), back: () => this.setState({ step: 0 }),
    audList: labels.map((label, i) => s.aud === i
      ? { label, on: true, fg: '#0b1623', bg: '#0ea5e9', bd: '#0ea5e9', tap: () => this.setState({ aud: i }) }
      : { label, on: false, fg: '#cbd5e1', bg: '#243650', bd: '#33486a', tap: () => this.setState({ aud: i }) })
  };
}
}
</script>
</body>
</html>
