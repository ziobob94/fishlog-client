<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>FishLog Statistiche</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#111c2c;color:#f1f5f9}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.lab{margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9db0c8}
.nv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;color:#b4c3d6;font-size:11px;font-weight:600}
</style>
</helmet>
<div style="width:390px;height:1040px;box-sizing:border-box;background:#111c2c;display:flex;flex-direction:column;overflow:hidden">

  <header style="display:flex;align-items:center;gap:8px;padding:12px 16px 12px 8px;min-height:64px;box-sizing:border-box">
    <a href="Main.dc.html" aria-label="Indietro" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em">Statistiche</h1>
  </header>

  <main style="flex:1;overflow:hidden;padding:4px 16px 16px;display:flex;flex-direction:column;gap:24px">

    <section style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
      <div style="background:#1a293d;border:1px solid #33486a;border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:4px"><span style="font-family:'JetBrains Mono',monospace;font-size:32px;letter-spacing:-.04em;line-height:1;font-weight:500">24</span><span style="font-size:12px;color:#9db0c8;font-weight:600">Uscite totali</span></div>
      <div style="background:#1a293d;border:1px solid #33486a;border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:4px"><span style="font-family:'JetBrains Mono',monospace;font-size:32px;letter-spacing:-.04em;line-height:1;font-weight:500">87</span><span style="font-size:12px;color:#9db0c8;font-weight:600">Catture totali</span></div>
      <div style="background:#1a293d;border:1px solid #33486a;border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:4px"><span style="font-family:'JetBrains Mono',monospace;font-size:32px;letter-spacing:-.04em;line-height:1;font-weight:500;color:#fbbf24">3,8</span><span style="font-size:12px;color:#9db0c8;font-weight:600">Voto medio</span></div>
    </section>

    <section style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><h2 class="lab">Catture per mese</h2><span style="font-size:12px;color:#9db0c8">ultimi 12 mesi</span></div>
      <div style="background:#1a293d;border:1px solid #33486a;border-radius:20px;padding:16px 14px 12px">
        <div role="img" aria-label="Grafico a barre delle catture per mese, picco a ottobre" style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:140px">
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="12"><div style="height:{{b.h}}px;border-radius:6px 6px 2px 2px;background:{{b.c}}"></div></sc-for>
        </div>
        <div aria-hidden="true" style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;margin-top:8px">
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="12"><span style="font-size:11px;color:#9db0c8;text-align:center">{{b.m}}</span></sc-for>
        </div>
      </div>
    </section>

    <section style="display:flex;flex-direction:column;gap:12px">
      <h2 class="lab">Specie più catturate</h2>
      <div style="display:flex;flex-direction:column;gap:10px">
        <sc-for list="{{species}}" as="s" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;gap:12px;background:#1a293d;border:1px solid #33486a;border-radius:16px;padding:12px 14px;min-height:44px">
          <span style="flex:1;font-size:15px;font-weight:700">{{s.name}}</span>
          <span style="flex:1.2;height:8px;border-radius:4px;background:#243650;overflow:hidden"><span style="display:block;height:100%;width:{{s.w}}%;background:#0ea5e9;border-radius:4px"></span></span>
          <span style="width:28px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:14px">{{s.n}}</span>
        </div>
        </sc-for>
      </div>
    </section>
  </main>

  <nav aria-label="Navigazione principale" style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;background:#1a293d;border-top:1px solid #33486a;padding:8px 8px 14px;min-height:68px;box-sizing:border-box">
    <a href="Main.dc.html" class="nv"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.2a2 2 0 0 1 .7-1.5l6-5.2a2 2 0 0 1 2.6 0l6 5.2a2 2 0 0 1 .7 1.5V18a3 3 0 0 1-3 3h-2.5a1 1 0 0 1-1-1v-3.5a1 1 0 0 0-1-1h-1a1 1 0 0 0-1 1V20a1 1 0 0 1-1 1H7a3 3 0 0 1-3-3v-6.8Z"/></svg>Home</a>
    <a href="Uscite.dc.html" class="nv"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12.4c0-3.7 3.7-6.4 8.3-6.4s7.2 2.6 7.2 6.4-3 6.4-7.2 6.4-8.3-2.7-8.3-6.4Z"/><path d="M17.5 12.4l3.4-3.7a.8.8 0 0 1 1.3.5v6.4a.8.8 0 0 1-1.3.5l-3.4-3.7ZM7.2 11h.01"/></svg>Uscite</a>
    <a href="NuovaUscita.dc.html" aria-label="Nuova uscita" style="display:flex;justify-content:center;margin-top:-30px"><span style="width:56px;height:56px;border-radius:50%;background:#0ea5e9;color:#0b1623;display:flex;align-items:center;justify-content:center;border:4px solid #111c2c;box-shadow:0 6px 18px rgba(14,165,233,.35)"><svg class="i" viewBox="0 0 24 24" style="width:26px;height:26px;stroke-width:2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></a>
    <a href="Community.dc.html" class="nv"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-6.5l-3.7 3.3a.6.6 0 0 1-1-.45V17H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z"/></svg>Community</a>
    <a href="MarketLista.dc.html" class="nv"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8h13a1 1 0 0 1 1 1.1l-1 9.2a2.5 2.5 0 0 1-2.5 2.2H8a2.5 2.5 0 0 1-2.5-2.2l-1-9.2A1 1 0 0 1 5.500 8Z"/><path d="M8.5 8V7a3.5 3.5 0 0 1 7 0v1"/></svg>Market</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
renderVals() {
  const v = [2, 1, 3, 5, 6, 8, 9, 10, 12, 18, 9, 4];
  const m = ['D','G','F','M','A','M','G','L','A','S','O','N'];
  return {
    bars: v.map((n, i) => ({ h: Math.round(n / 18 * 140), m: m[i], c: n === 18 ? '#f59e0b' : '#0ea5e9' })),
    species: [
      { name: 'Spigola', n: 21, w: 100 }, { name: 'Orata', n: 14, w: 67 },
      { name: 'Sgombro', n: 11, w: 52 }, { name: 'Scorfano', n: 7, w: 33 }
    ]
  };
}
}
</script>
</body>
</html>
